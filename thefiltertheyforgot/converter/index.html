<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Converter - The Filter They Forgot</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
        padding-top: 100px;
      }
      h1 {
        color: #fff;
        text-align: center;
        margin-bottom: 40px;
        font-size: 2.2em;
        font-weight: 600;
      }
      .form-group {
        margin-bottom: 25px;
      }
      label {
        display: block;
        color: #bb86fc;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 1em;
      }
      select {
        width: 100%;
        padding: 10px;
        background-color: #2a2a2a;
        color: #e0e0e0;
        border: 1px solid #444;
        font-size: 1em;
        cursor: pointer;
      }
      select:hover {
        border-color: #bb86fc;
      }
      .upload-area {
        border: 2px dashed #444;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
      }
      .upload-area:hover {
        border-color: #bb86fc;
        background-color: #252525;
      }
      .upload-area.dragover {
        border-color: #bb86fc;
        background-color: #2a2a2a;
      }
      .upload-icon {
        font-size: 2.5em;
        margin-bottom: 10px;
        color: #666;
      }
      .upload-text {
        color: #aaa;
        font-size: 1em;
        margin-bottom: 5px;
      }
      .upload-subtext {
        color: #666;
        font-size: 0.85em;
      }
      input[type="file"] {
        display: none;
      }
      .file-info {
        background-color: #2a2a2a;
        padding: 12px;
        margin-top: 12px;
        display: none;
      }
      .file-info.visible {
        display: block;
      }
      .file-name {
        color: #bb86fc;
        font-weight: 600;
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #bb86fc;
        color: #000;
        border: none;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      button:hover:not(:disabled) {
        background-color: #d4b3ff;
      }
      button:disabled {
        background-color: #444;
        color: #666;
        cursor: not-allowed;
      }
      .status {
        margin-top: 15px;
        padding: 12px;
        display: none;
      }
      .status.visible {
        display: block;
      }
      .status.success {
        background-color: #1b4332;
        border: 1px solid #2d6a4f;
        color: #95d5b2;
      }
      .status.error {
        background-color: #4a1818;
        border: 1px solid #721c1c;
        color: #ff6b6b;
      }
      .privacy-note {
        margin-top: 30px;
        padding: 20px 0;
        border-top: 1px solid #333;
        text-align: center;
      }
      .privacy-note p {
        margin: 5px 0;
        color: #aaa;
        font-size: 0.9em;
      }
      footer {
        text-align: center;
        margin-top: 50px;
        padding: 30px 20px;
        border-top: 1px solid #333;
        color: #888;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>List Converter for The Filter They Forgot</h1>

      <div class="form-group">
        <label for="fromVersion">From Version</label>
        <select id="fromVersion">
          <option value="1.3.0">1.3.0 (Folder)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="toVersion">To Version</label>
        <select id="toVersion">
          <option value="1.4.0">1.4.0 (ZIP)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Upload List</label>
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📁</div>
          <div class="upload-text">Click to browse or drag folder here</div>
          <div class="upload-subtext">Select the folder containing your list files</div>
        </div>
        <input type="file" id="fileInput" webkitdirectory directory multiple />
        <div class="file-info" id="fileInfo">
          <div>Selected: <span class="file-name" id="fileName"></span></div>
          <div style="color: #666; font-size: 0.85em; margin-top: 3px;" id="fileCount"></div>
        </div>
      </div>

      <button id="convertBtn" disabled>Convert List</button>
      
      <div class="status" id="status"></div>

      <div class="privacy-note">
        <p>All conversion happens locally in your browser, no data is sent to any server, your lists never leave your device.</p>
      </div>
    </div>

    <footer>&copy; deqpi All rights reserved.</footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
