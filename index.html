<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  padding: 40px;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  line-height: 1.5;
}

.container {
  max-width: 800px;
  margin: 0 auto;
}

h1 {
  font-size: 24px;
  color: #ffffff;
  margin-bottom: 30px;
  font-weight: 500;
}

h1 a {
  color: #bb86fc;
  text-decoration: none;
}

h1 a:hover {
  color: #ffffff;
}

.file-list {
  list-style: none;
  background: rgba(30, 30, 30, 0.5);
  border-radius: 8px;
  padding: 10px;
}

.file-list li {
  margin-bottom: 2px;
}

.file-list li:last-child {
  margin-bottom: 0;
}

.file-list a {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  color: #e0e0e0;
  text-decoration: none;
  border-radius: 6px;
  transition: all 0.2s ease;
}

.file-list a:hover {
  background: rgba(187, 134, 252, 0.1);
  color: #ffffff;
}

.file-icon {

  height: 20px;
